<!DOCTYPE html>
<html class="light" lang="vi">

<head>

    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <script id="tailwind-config">
        tailwind.config = {

                extend: {
                    colors: {
                        "primary": "#3B82F6",
                        "background-light": "#E2E8F0",
                        "background-dark": "#E2E8F0",
                        "surface-dark": "#FFFFFF",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
    <script src="../constants.js"></script>
    <style type="text/tailwindcss">
        body {
            font-family: "Space Grotesk", sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #E2E8F0;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }
        .flatpickr-calendar {
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            border-radius: 1rem;
            border: 1px solid #E2E8F0;
        }
    </style>
</head>

<script>
    function renderAuthUI() {
        const token = localStorage.getItem("accessToken");
        const acc = JSON.parse(localStorage.getItem("account") || "{}");

        const btns = document.getElementById("auth-buttons");
        const userBox = document.getElementById("user-box");
        const avatar = document.getElementById("user-menu-button");

        if (!btns || !userBox) return;

        if (token) {
            btns.classList.add("hidden");
            userBox.classList.remove("hidden");

            const defaultAvatar = "./avt.png";
            if (avatar) {
                avatar.style.backgroundImage = `url('${acc?.avatarUrl || defaultAvatar}')`;
            }
        } else {
            btns.classList.remove("hidden");
            userBox.classList.add("hidden");
        }
    }
    async function loadComponent(id, file) {
        const res = await fetch(file);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;

        if (id === "header-container") {
            setActiveMenu();
            renderAuthUI();
        }
    }
    function setActiveMenu() {
        const links = document.querySelectorAll(".nav-link");
        const currentPage = window.location.pathname.split("/").pop() || "index.html";

        links.forEach(link => {
            const linkPage = link.getAttribute("href");
            if (linkPage === currentPage) {
                link.classList.add("active");
            }
        });
    }

    window.toggleUserMenu = function () {
        const menu = document.getElementById("user-menu");
        menu?.classList.toggle("hidden");
    };

    window.toggleMobileMenu = function () {
        const menu = document.getElementById("mobile-menu");
        menu?.classList.toggle("hidden");
    };


    loadComponent("header-container", "header.html");
    loadComponent("footer-container", "footer.html");
</script>

<body
    class="bg-[#E2E8F0] min-h-screen flex flex-col overflow-x-hidden transition-colors duration-300 text-[#1E293B] antialiased">
    <div id="header-container"></div>

    <main class="flex-1 flex flex-col items-center w-full px-4 py-8 md:py-16">
        <div class="max-w-[1200px] w-full mb-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div class="space-y-1">
                    <h2 class="text-[#1E293B] text-3xl font-black leading-tight tracking-tight">
                        Lịch Sử <span class="text-primary">Nhận Diện</span>
                    </h2>
                    <p class="text-slate-500 text-sm font-normal">
                        Theo dõi lịch sử phân loại rác của bạn một cách tối giản.
                    </p>
                </div>
                <div class="flex items-center gap-3">
                    <div
                        class="relative flex items-center px-4 py-2 bg-white rounded-xl border border-[#CBD5E1] cursor-pointer hover:border-primary/50 transition-all shadow-sm">
                        <span class="material-symbols-outlined text-primary text-[20px] mr-2">calendar_month</span>
                        <input type="text" id="dateFilterInput"
                            class="bg-transparent border-none text-[#1E293B] text-sm font-medium focus:ring-0 w-[190px] cursor-pointer p-0 m-0"
                            placeholder="Lọc theo khoảng ngày..." readonly>
                    </div>
                </div>
            </div>
        </div>
        <div class="max-w-[1200px] w-full">
            <div class="bg-white rounded-3xl border border-[#CBD5E1] overflow-hidden shadow-xl shadow-slate-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-[#CBD5E1]">
                                <th class="px-6 py-5 text-[#1E293B] font-bold text-xs uppercase tracking-widest opacity-60">Thời gian
                                    quét</th>
                                <th
                                    class="px-6 py-5 text-[#1E293B] font-bold text-xs uppercase tracking-widest opacity-60 text-center">
                                    Hình ảnh</th>
                                <th class="px-6 py-5 text-[#1E293B] font-bold text-xs uppercase tracking-widest opacity-60">Chất liệu
                                </th>
                                <th class="px-6 py-5 text-[#1E293B] font-bold text-xs uppercase tracking-widest opacity-60">Thùng rác
                                </th>
                                <th class="px-6 py-5 text-[#1E293B] font-bold text-xs uppercase tracking-widest opacity-60">Độ tin
                                    cậy</th>
                                <th
                                    class="px-6 py-5 text-[#1E293B] font-bold text-xs uppercase tracking-widest opacity-60 text-right">
                                    Chi tiết</th>
                            </tr>
                        </thead>
                        <tbody id="history-body" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="6" class="px-6 py-10 text-center text-slate-400">
                                    Đang tải dữ liệu...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="mt-6 flex justify-between items-center px-4">
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Hiển thị các lần quét gần nhất
                </p>
                <div class="flex gap-4">
                    <button
                        class="text-slate-400 hover:text-primary transition-all disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1 text-sm font-bold uppercase tracking-widest"
                        disabled="">
                        <span class="material-symbols-outlined text-sm">arrow_back</span> Trước
                    </button>
                    <button
                        class="text-slate-600 hover:text-primary transition-all flex items-center gap-1 text-sm font-bold uppercase tracking-widest">
                        Sau <span class="material-symbols-outlined text-sm">arrow_forward</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <div id="footer-container"></div>
</body>

<script>
    function formatDate(isoString) {
        if (!isoString) return { date: "", time: "" };
        const d = new Date(isoString);
        return {
            date: d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }),
            time: d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
        };
    }

    function getBinStyle(trashType) {
        if (!trashType) return { color: "#64748b", bg: "bg-slate-500", icon: "delete" };
        const t = trashType.toLowerCase();
        if (t.includes("hữu cơ")) return { color: "#F59E0B", bg: "bg-amber-500", icon: "compost" };
        if (t.includes("nguy hại")) return { color: "#EF4444", bg: "bg-red-500", icon: "dangerous" };
        if (t.includes("tái chế")) return { color: "#3B82F6", bg: "bg-blue-500", icon: "recycling" };
        return { color: "#94A3B8", bg: "bg-slate-400", icon: "delete" };
    }

    let allHistoryData = [];

    async function loadHistory() {
        const tbody = document.getElementById("history-body");
        const token = localStorage.getItem("accessToken");

        if (!token) {
            tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-slate-500 font-medium">Bạn chưa đăng nhập. Vui lòng <a href="login.html" class="text-primary font-bold hover:underline">Đăng nhập</a> để xem lịch sử.</td></tr>`;
            return;
        }

        try {
            const res = await fetch(API_BASE + "/api/v1/user/history", {
                headers: { "Authorization": "Bearer " + token }
            });

            if (!res.ok) {
                if (res.status === 401) {
                    localStorage.removeItem("accessToken");
                    window.location.href = "login.html";
                }
                throw new Error("Không thể tải lịch sử");
            }

            const json = await res.json();
            allHistoryData = json.data || [];

            // Re-render empty or full
            renderTable(allHistoryData);

        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-red-500 font-medium font-body">Lỗi: Không thể tải lịch sử</td></tr>`;
        }
    }

    function renderTable(dataArray) {
        const tbody = document.getElementById("history-body");
        if (!dataArray || dataArray.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-slate-400 font-medium">Chưa có dữ liệu nào trong khoảng thời gian này.</td></tr>`;
            return;
        }
        let html = "";
        dataArray.forEach(item => {
            const dt = formatDate(item.createdAt);
            const conf = item.confidence ? Math.round(item.confidence * 100) : 0;
            const style = getBinStyle(item.trashType);

            html += `
            <tr class="hover:bg-slate-50/80 transition-all group cursor-pointer" onclick="window.location.href='result_analys.html?id=${item.aiRequestId}'">
                <td class="px-6 py-5">
                    <div class="flex flex-col">
                        <span class="text-[#1E293B] font-bold text-sm tracking-tight">${dt.date}</span>
                        <span class="text-slate-400 text-xs font-medium">${dt.time}</span>
                    </div>
                </td>
                <td class="px-6 py-5">
                    <div class="size-12 mx-auto rounded-xl overflow-hidden border border-slate-100 transition-all hover:scale-110 shadow-sm bg-slate-50">
                        <div class="w-full h-full bg-cover bg-center" style='background-image: url("${item.cloudinaryUrl}");'></div>
                    </div>
                </td>
                <td class="px-6 py-5">
                    <span class="text-[#1E293B] font-bold text-sm underline decoration-primary/20 decoration-2 underline-offset-4">${item.labelDisplay}</span>
                </td>
                <td class="px-6 py-5">
                    <div class="flex items-center gap-2">
                        <div class="size-8 rounded-lg flex items-center justify-center border shadow-sm" style="border-color:${style.color}30; background-color:${style.color}10; color:${style.color}">
                            <span class="material-symbols-outlined text-lg">${style.icon}</span>
                        </div>
                        <span class="text-slate-600 text-sm font-medium tracking-tight">${item.trashType}</span>
                    </div>
                </td>
                <td class="px-6 py-5">
                    <div class="flex items-center gap-3">
                        <div class="flex-1 w-20 bg-slate-100 h-1.5 rounded-full overflow-hidden hidden lg:block shadow-inner">
                            <div class="h-full transition-all duration-700 ease-out" style="width: ${conf}%; background-color: ${style.color}"></div>
                        </div>
                        <span class="font-black text-xs tracking-widest" style="color: ${style.color}">${conf}%</span>
                    </div>
                </td>
                <td class="px-6 py-5 text-right">
                    <button class="p-2.5 hover:bg-white hover:shadow-md border border-transparent hover:border-slate-100 rounded-xl text-slate-400 hover:text-primary transition-all">
                        <span class="material-symbols-outlined text-xl">visibility</span>
                    </button>
                </td>
            </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function initDatePicker() {
        flatpickr("#dateFilterInput", {
            mode: "range",
            dateFormat: "d/m/Y",
            locale: "vn",
            onChange: function (selectedDates, dateStr, instance) {
                // If the user clears the input or selects a full range
                if (selectedDates.length === 0) {
                    renderTable(allHistoryData);
                } else if (selectedDates.length === 2) {
                    const start = selectedDates[0];
                    const end = selectedDates[1];
                    // end date should be included up to 23:59:59
                    end.setHours(23, 59, 59, 999);

                    const filtered = allHistoryData.filter(item => {
                        const itemDate = new Date(item.createdAt);
                        return itemDate >= start && itemDate <= end;
                    });
                    renderTable(filtered);
                }
            }
        });
    }

    // Load data after component loads
    window.addEventListener("DOMContentLoaded", () => {
        initDatePicker();
        setTimeout(() => loadHistory(), 300); // Wait a bit for constants.js/header just in case
    });
</script>

</html>
