<script>
    function renderAuthUI() {
        const token = localStorage.getItem("accessToken");
        const acc = JSON.parse(localStorage.getItem("account") || "{}");

        const btns = document.getElementById("auth-buttons");
        const userBox = document.getElementById("user-box");
        const avatar = document.getElementById("user-menu-button");

        if (!btns || !userBox) return;

        if (token) {
            btns.classList.add("hidden");
            userBox.classList.remove("hidden");

            const defaultAvatar = "./avt.png";
            if (avatar) {
                avatar.style.backgroundImage = `url('${acc?.avatarUrl || defaultAvatar}')`;
            }
        } else {
            btns.classList.remove("hidden");
            userBox.classList.add("hidden");
        }
    }
    async function loadComponent(id, file) {
        const res = await fetch(file);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;

        if (id === "header-container") {
            setActiveMenu();
            renderAuthUI();
        }
    }
    function setActiveMenu() {
        const links = document.querySelectorAll(".nav-link");
        const currentPage = window.location.pathname.split("/").pop() || "index.html";

        links.forEach(link => {
            const linkPage = link.getAttribute("href");
            if (linkPage === currentPage) {
                link.classList.add("active");
            }
        });
    }

    window.toggleUserMenu = function () {
        const menu = document.getElementById("user-menu");
        menu?.classList.toggle("hidden");
    };

    window.toggleMobileMenu = function () {
        const menu = document.getElementById("mobile-menu");
        menu?.classList.toggle("hidden");
    };


    loadComponent("header-container", "header.html");
    loadComponent("footer-container", "footer.html");
</script>

<script>
    function formatDate(isoString) {
        if (!isoString) return { date: "", time: "" };
        const d = new Date(isoString);
        return {
            date: d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }),
            time: d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
        };
    }

    function getBinStyle(trashType) {
        if (!trashType) return { color: "#6b7280", bg: "bg-gray-500", icon: "delete" }; // gray
        const t = trashType.toLowerCase();
        if (t.includes("hữu cơ")) return { color: "#eab308", bg: "bg-yellow-500", icon: "compost" }; // yellow
        if (t.includes("nguy hại")) return { color: "#ef4444", bg: "bg-red-500", icon: "dangerous" }; // red
        if (t.includes("tái chế")) return { color: "#13ec5b", bg: "bg-primary", icon: "recycling" }; // green
        return { color: "#6b7280", bg: "bg-gray-500", icon: "delete" };
    }

    let allHistoryData = [];

    async function loadHistory() {
        const tbody = document.getElementById("history-body");
        const token = localStorage.getItem("accessToken");

        if (!token) {
            tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-gray-400">Bạn chưa đăng nhập. Vui lòng <a href="login.html" class="text-primary underline">Đăng nhập</a> để xem lịch sử.</td></tr>`;
            return;
        }

        try {
            const res = await fetch(API_BASE + "/api/v1/user/history", {
                headers: { "Authorization": "Bearer " + token }
            });

            if (!res.ok) {
                if(res.status === 401) {
                    localStorage.removeItem("accessToken");
                    window.location.href = "login.html";
                }
                throw new Error("Không thể tải lịch sử");
            }

            const json = await res.json();
            allHistoryData = json.data || [];
            
            // Re-render empty or full
            renderTable(allHistoryData);

        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-red-400">Lỗi: ${err.message}</td></tr>`;
        }
    }

    function renderTable(dataArray) {
        const tbody = document.getElementById("history-body");
        if (!dataArray || dataArray.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">Chưa có dữ liệu nào trong khoảng thời gian này.</td></tr>`;
            return;
        }
        let html = "";
        dataArray.forEach(item => {
            const dt = formatDate(item.createdAt);
            const conf = item.confidence ? Math.round(item.confidence * 100) : 0;
            const style = getBinStyle(item.trashType);

            html += `
            <tr class="hover:bg-white/5 transition-colors group cursor-pointer" onclick="window.location.href='result_analys.html?id=${item.aiRequestId}'">
                <td class="px-6 py-5">
                    <div class="flex flex-col">
                        <span class="text-white font-medium">${dt.date}</span>
                        <span class="text-gray-500 text-xs">${dt.time}</span>
                    </div>
                </td>
                <td class="px-6 py-5">
                    <div class="size-12 mx-auto rounded-lg overflow-hidden border border-[#3b5443] transition-colors bg-gray-800">
                        <div class="w-full h-full bg-cover bg-center" style='background-image: url("${item.cloudinaryUrl}");'></div>
                    </div>
                </td>
                <td class="px-6 py-5">
                    <span class="text-white font-semibold">${item.labelDisplay}</span>
                </td>
                <td class="px-6 py-5">
                    <div class="flex items-center gap-2">
                        <div class="size-7 rounded-md flex items-center justify-center border" style="border-color:${style.color}40; background-color:${style.color}20; color:${style.color}">
                            <span class="material-symbols-outlined text-lg">${style.icon}</span>
                        </div>
                        <span class="text-gray-300 text-sm">${item.trashType}</span>
                    </div>
                </td>
                <td class="px-6 py-5">
                    <div class="flex items-center gap-3">
                        <div class="flex-1 w-20 bg-gray-800 h-1 rounded-full overflow-hidden hidden lg:block">
                            <div class="h-full" style="width: ${conf}%; background-color: ${style.color}; box-shadow: 0 0 8px ${style.color}80"></div>
                        </div>
                        <span class="font-bold text-sm" style="color: ${style.color}">${conf}%</span>
                    </div>
                </td>
                <td class="px-6 py-5 text-right">
                    <button class="p-2 hover:bg-white/10 rounded-lg text-gray-400 hover:text-white transition-all">
                        <span class="material-symbols-outlined text-xl">visibility</span>
                    </button>
                </td>
            </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function initDatePicker() {
        flatpickr("#dateFilterInput", {
            mode: "range",
            dateFormat: "d/m/Y",
            locale: "vn",
            onChange: function(selectedDates, dateStr, instance) {
                // If the user clears the input or selects a full range
                if (selectedDates.length === 0) {
                    renderTable(allHistoryData);
                } else if (selectedDates.length === 2) {
                    const start = selectedDates[0];
                    const end = selectedDates[1];
                    // end date should be included up to 23:59:59
                    end.setHours(23, 59, 59, 999);

                    const filtered = allHistoryData.filter(item => {
                        const itemDate = new Date(item.createdAt);
                        return itemDate >= start && itemDate <= end;
                    });
                    renderTable(filtered);
                }
            }
        });
    }

    // Load data after component loads
    window.addEventListener("DOMContentLoaded", () => {
        initDatePicker();
        setTimeout(() => loadHistory(), 300); // Wait a bit for constants.js/header just in case
    });
</script>
