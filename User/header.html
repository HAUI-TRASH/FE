<style>
  .nav-link {
    position: relative;
    font-size: 14px;
    font-weight: 500;
    color: #475569;
    transition: 0.3s;
    white-space: nowrap;
  }

  .nav-link:hover {
    color: #3b82f6;
  }

  .nav-link.active {
    color: #3b82f6;
    font-weight: 700;
  }

  .nav-link.active::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 0;
    width: 100%;
    height: 2px;
    background: #3b82f6;
    border-radius: 2px;
  }

  /* Mobile nav overrides — same .nav-link class, stacked vertical */
  #mobile-menu .nav-link {
    display: block;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 500;
    color: #475569;
    border-radius: 8px;
    transition: 0.3s;
    white-space: normal;
  }

  /* Override display:block when hidden by brand filter */
  #mobile-menu .nav-link.hidden {
    display: none !important;
  }

  #mobile-menu .nav-link:hover {
    background: #f1f5f9;
    color: #3b82f6;
  }

  #mobile-menu .nav-link.active {
    color: #3b82f6;
    font-weight: 700;
    background: transparent;
  }

  #mobile-menu .nav-link.active::after {
    bottom: 8px;
    left: 16px;
    width: calc(100% - 32px);
  }

  #brand-arrow {
    transition: transform 0.2s ease;
  }
  #brand-arrow.rotate-180 {
    transform: rotate(180deg);
  }
</style>

<header
  class="sticky top-0 z-50 w-full border-b border-[#CBD5E1] bg-white/80 backdrop-blur-md"
>
  <div
    class="px-4 md:px-10 py-3 flex items-center justify-between max-w-[1200px] mx-auto w-full gap-3"
  >
    <!-- Left -->
    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
      <a href="https://www.haui.edu.vn/vn" class="flex items-center shrink-0">
        <!-- <img src="../img logo/logoHaUI.png" alt="HaUI Logo" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full" /> -->
      </a>

      <a href="index.html" class="flex items-center gap-2 min-w-0 shrink-0">
        <span
          class="material-symbols-outlined text-2xl sm:text-3xl text-[#3B82F6] shrink-0"
          >recycling</span
        >
      </a>

      <!-- Brand variant dropdown (PC) -->
      <div class="relative brand-dropdown shrink-0">
        <button
          id="brand-dropdown-btn"
          class="flex items-center gap-1.5 text-[#1E293B] text-base sm:text-xl font-bold leading-tight tracking-tight bg-[#F1F5F9] hover:bg-[#E2E8F0] rounded-lg transition-colors border border-[#CBD5E1] px-2 py-2 lg:px-3 lg:py-1.5"
          onclick="toggleBrandDropdown()"
        >
          <span id="brand-label" class="hidden lg:inline">SmartDisposal-U</span>
          <span class="material-symbols-outlined text-base sm:text-lg text-slate-400 transition-transform hidden lg:inline" id="brand-arrow">expand_more</span>
          <span id="brand-mobile-icon" class="material-symbols-outlined text-xl text-[#3B82F6] lg:hidden">apps</span>
        </button>
        <div
          id="brand-menu"
          class="absolute left-0 top-full mt-1.5 w-56 max-w-[calc(100vw-2rem)] bg-white border border-[#CBD5E1] rounded-xl shadow-xl shadow-slate-200/50 py-1.5 z-50 hidden"
        >
          <button
            class="brand-option flex items-center gap-3 w-full px-4 py-2.5 text-sm font-bold text-[#1E293B] hover:bg-[#F1F5F9] transition-colors"
            data-brand-val="SmartDisposal-U"
            onclick="selectBrand('SmartDisposal-U', this)">
            <span class="material-symbols-outlined text-blue-500 text-lg">person</span>
            <div class="text-left">
              <div>SmartDisposal-U</div>
              <div class="text-[10px] font-medium text-slate-400 normal-case">Người dùng cá nhân</div>
            </div>
          </button>
          <button
            class="brand-option flex items-center gap-3 w-full px-4 py-2.5 text-sm font-bold text-[#1E293B] hover:bg-[#F1F5F9] transition-colors"
            data-brand-val="SmartDisposal-P"
            onclick="selectBrand('SmartDisposal-P', this)">
            <span class="material-symbols-outlined text-emerald-500 text-lg">business</span>
            <div class="text-left">
              <div>SmartDisposal-P</div>
              <div class="text-[10px] font-medium text-slate-400 normal-case">Trạm thu gom rác</div>
            </div>
          </button>
          <button
            class="brand-option flex items-center gap-3 w-full px-4 py-2.5 text-sm font-bold text-[#1E293B] hover:bg-[#F1F5F9] transition-colors"
            data-brand-val="SmartDisposal-I"
            onclick="selectBrand('SmartDisposal-I', this)">
            <span class="material-symbols-outlined text-purple-500 text-lg">monitoring</span>
            <div class="text-left">
              <div>SmartDisposal-I</div>
              <div class="text-[10px] font-medium text-slate-400 normal-case">Giải pháp AI cho nhà máy</div>
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- Desktop nav -->
    <nav class="hidden lg:flex flex-1 justify-center gap-6 lg:gap-8 px-4">
      <a class="nav-link" href="index.html" data-brand="U,P,I">Trang chủ</a>
      <a class="nav-link" href="result_analys.html" data-brand="U">Kết quả</a>
      <a class="nav-link" href="list_blog.html" data-brand="U,P,I">Blog</a>
      <a class="nav-link" href="list_story.html" data-brand="U">Câu truyện</a>
      <a class="nav-link" href="history.html" data-brand="U">Lịch sử</a>
      <a class="nav-link" href="guide.html" data-brand="U,P,I">Hướng dẫn</a>
      <a class="nav-link" href="about-us.html" data-brand="U,P,I">Về chúng tôi</a>
    </nav>

    <!-- Right -->
    <div class="flex items-center gap-2 sm:gap-4 shrink-0">
      <!-- Hamburger button -->
      <button
        id="mobile-menu-button"
        class="lg:hidden flex items-center justify-center w-10 h-10 rounded-lg text-gray-500 hover:bg-[#F1F5F9] hover:text-[#1E293B] transition"
        onclick="toggleMobileMenu()">
        <span class="material-symbols-outlined">menu</span>
      </button>

      <!-- AUTH AREA (PC) -->
      <div id="auth-area" class="flex items-center gap-3">
        <!-- NOT LOGIN -->
        <div id="auth-buttons" class="flex items-center gap-2">
          <a href="login.html"
            class="px-3 py-2 text-sm text-[#1E293B] border border-[#CBD5E1] rounded-lg hover:bg-[#F1F5F9] transition">
            Đăng nhập
          </a>
          <a href="register.html"
            class="px-3 py-2 text-sm bg-[#3B82F6] text-white font-semibold rounded-lg hover:opacity-90 transition">
            Đăng ký
          </a>
        </div>

        <!-- LOGGED IN -->
        <div id="user-box" class="flex items-center gap-3 hidden">
          <!-- Points badge -->
          <div id="user-points-badge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-yellow-50 border border-yellow-200 shadow-sm cursor-default" title="Điểm tích lũy">
            <span class="text-lg">⭐</span>
            <span id="user-points" class="text-sm font-black text-yellow-600">0</span>
          </div>
          <!-- Avatar + dropdown wrapped in relative container -->
          <div class="relative">
            <button
              id="user-menu-button"
              class="bg-center bg-no-repeat bg-cover rounded-full w-9 h-9 sm:w-10 sm:h-10 border-2 border-[#CBD5E1] hover:border-primary transition-colors"
              onclick="toggleUserMenu()"></button>

            <div id="user-menu"
              class="absolute right-0 mt-2 w-64 bg-white border border-[#CBD5E1] rounded-xl shadow-xl shadow-slate-200/50 py-2 z-[100] hidden">
              <div class="px-4 py-3 border-b border-[#CBD5E1]">
                <p id="user-menu-name" class="text-sm font-bold text-[#1E293B]">Đang tải...</p>
                <p id="user-menu-email" class="text-xs text-slate-500 mt-0.5"></p>
              </div>
              <a href="#"
                class="flex items-center px-4 py-2.5 text-sm text-[#1E293B] hover:bg-[#F1F5F9] transition-colors">
                <span class="material-symbols-outlined text-lg mr-3 text-slate-400">person</span>
                Tài khoản của bạn
              </a>
              <a href="#" onclick="ecoscanLogout()"
                class="flex items-center px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 transition-colors">
                <span class="material-symbols-outlined text-lg mr-3">logout</span>
                Đăng xuất
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== MOBILE / TABLET MENU ===== -->
  <!-- Mirrors PC header: brand accordion → nav links → auth -->
  <div id="mobile-menu" class="lg:hidden hidden border-t border-[#CBD5E1] bg-white">

    <!-- Nav links (mirrors PC center nav, filtered by brand via data-brand) -->
    <nav class="flex flex-col gap-1 px-4 pt-4 pb-4 border-b border-slate-100">
      <a class="nav-link" href="index.html" data-brand="U,P,I">Trang chủ</a>
      <a class="nav-link" href="result_analys.html" data-brand="U">Kết quả</a>
      <a class="nav-link" href="list_blog.html" data-brand="U,P,I">Blog</a>
      <a class="nav-link" href="list_story.html" data-brand="U">Câu truyện</a>
      <a class="nav-link" href="history.html" data-brand="U">Lịch sử</a>
      <a class="nav-link" href="guide.html" data-brand="U,P,I">Hướng dẫn</a>
      <a class="nav-link" href="about-us.html" data-brand="U,P,I">Về chúng tôi</a>
    </nav>

    <!-- 3. Auth section (mirrors PC right section) -->
    <div class="px-4 py-4">
      <!-- NOT LOGIN -->
      <div id="mobile-auth-buttons" class="flex flex-col gap-2">
        <a href="login.html"
          class="block text-center rounded-xl border border-[#CBD5E1] px-3 py-2.5 text-sm font-medium text-[#1E293B] hover:bg-[#F1F5F9] transition">
          Đăng nhập
        </a>
        <a href="register.html"
          class="block text-center rounded-xl bg-[#3B82F6] px-3 py-2.5 text-sm font-semibold text-white hover:opacity-90 transition">
          Đăng ký
        </a>
      </div>
      <!-- LOGGED IN -->
      <div id="mobile-user-box" class="hidden">
        <div class="flex items-center gap-3">
          <div id="mobile-user-avatar"
            class="bg-center bg-no-repeat bg-cover rounded-full w-11 h-11 border-2 border-[#CBD5E1] shrink-0"></div>
          <div class="min-w-0">
            <p id="mobile-user-name" class="text-sm font-bold text-[#1E293B] truncate">Đang tải...</p>
            <p id="mobile-user-email" class="text-xs text-slate-500 truncate"></p>
          </div>
        </div>
        <a href="#" onclick="ecoscanLogout()"
          class="flex items-center justify-center gap-2 mt-3 px-3 py-2.5 text-sm text-red-500 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">
          <span class="material-symbols-outlined text-lg">logout</span>
          Đăng xuất
        </a>
      </div>
    </div>
  </div>
</header>
